; ============================================================
; ESP32 CYD (Cheap Yellow Display 2.8") - Server Screen
; Board: ESP32-2432S028R | Display: ILI9341 320x240
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

board_build.partitions = huge_app.csv

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.3.11
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson @ ^6.21.5

build_flags =
    ; ---- LVGL: point to include/ for lv_conf.h ----
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -include cyd_compat.h

    ; ---- TFT_eSPI: Load custom setup via flags (no User_Setup.h needed) ----
    -D USER_SETUP_LOADED
    -D ILI9341_DRIVER

    ; ---- TFT Dimensions ----
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

    ; ---- CYD SPI Pins ----
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_MISO=12

    ; ---- Backlight ----
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH

    ; ---- Touch CS (IRQ handled in code) ----
    -D TOUCH_CS=33

    ; ---- SPI Frequencies ----
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

    ; ---- Color Fixes ----
    -D TFT_INVERSION_ON

    ; ---- Fonts needed by TFT_eSPI ----
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT

    ; ---- Stack / optimization ----
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -O2

lib_archive = false
